# Runs on every push to main (Cloud Build trigger): build + deploy API, then build + deploy web.
# Config (secrets, Cloud SQL, instance counts) was set by the first manual deploy and is kept; only the image changes.
# Substitutions with defaults can be overridden in the trigger.
substitutions:
  _REGION: asia-southeast1
  _REPO: guru
steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/api/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}", "."]
  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}"]
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "guru-api", "--region", "${_REGION}", "--image", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}"]
  # The web build bakes the API address in, so look it up after the API is deployed.
  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        API_URL=$$(gcloud run services describe guru-api --region ${_REGION} --format='value(status.url)')
        docker build -f apps/web/Dockerfile --build-arg GURU_API_ORIGIN=$$API_URL \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA} .
  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}"]
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "guru-web", "--region", "${_REGION}", "--image", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}"]
options:
  logging: CLOUD_LOGGING_ONLY
