      responses: {"200": {description: Created, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /macros/{macro_id}:
    put:
      operationId: updateMacro
      parameters: [{name: macro_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
    delete:
      operationId: deleteMacro
      parameters: [{name: macro_id, in: path, required: true, schema: {type: integer}}]
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /care/cases/{case_id}/macros/{macro_id}/preview:
    post:
      operationId: previewCaseMacro
      description: Render the macro's text for this case and describe its actions. Read-only.
      parameters: [{name: case_id, in: path, required: true, schema: {type: integer}}, {name: macro_id, in: path, required: true, schema: {type: integer}}]
      responses: {"200": {description: Preview, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /care/cases/{case_id}/macros/{macro_id}/apply:
    post:
      operationId: applyCaseMacro
      description: Run the macro's case actions (optionally only the given indexes). The reply text is sent through the normal reply route.
      parameters: [{name: case_id, in: path, required: true, schema: {type: integer}}, {name: macro_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: Per-action results, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /macro-rules:
    get:
      operationId: listMacroRules
      description: Auto macros - rules that run a macro when any of their triggers fires.
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createMacroRule
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: Created, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /macro-rules/{rule_id}:
    put:
      operationId: updateMacroRule
      parameters: [{name: rule_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
    delete:
      operationId: deleteMacroRule
      parameters: [{name: rule_id, in: path, required: true, schema: {type: integer}}]
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /content:
    get:
      operationId: listContent
      description: Content calendar — items whose scheduled_for falls in the window, plus in-flight unscheduled items.
      parameters:
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {name: state, in: query, schema: {type: string}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createContent
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: Created, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /content/{content_id}:
    get:
      operationId: getContent
      parameters: [{name: content_id, in: path, required: true, schema: {type: integer}}]
      responses: {"200": {description: Item + approval history, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
    patch:
      operationId: updateContent
      description: Edit fields; a scheduled_for change is the calendar drag-drop.
      parameters: [{name: content_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
    delete:
      operationId: deleteContent
      parameters: [{name: content_id, in: path, required: true, schema: {type: integer}}]
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /content/{content_id}/transition:
    post:
      operationId: transitionContent
      description: Non-approval transitions — submit / retract / revise / resubmit / schedule / unapprove / unschedule / publish.
      parameters: [{name: content_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /content/{content_id}/review:
    post:
      operationId: reviewContent
      description: The approve / reject decision (templates:approve).
      parameters: [{name: content_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /content/media:
    post:
      operationId: uploadContentMedia
      description: One real picture/video upload for a content calendar item. Returns {url, filename, content_type, size} -- add the url to the item's media list.
      requestBody: {content: {multipart/form-data: {schema: {type: object, properties: {file: {type: string, format: binary}}}}}}
      responses: {"200": {description: Uploaded, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /content/assist:
    post:
      operationId: suggestContent
      description: AI caption + hashtag suggestions for a draft post (real, costed OpenRouter call) -- never auto-applied.
      requestBody: {content: {application/json: {schema: {type: object, properties: {topic: {type: string}, draft: {type: string}, channel: {type: string}}}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /content/ai/compliance:
    post:
      operationId: checkContentCompliance
      description: Deterministic pre-approval check of draft text -- named rules with weights and bands, nearby regulator notices, and (when rewrite is true) a Gemini rewrite that is advice only and never changes the score.
      requestBody: {content: {application/json: {schema: {type: object, properties: {text: {type: string}, rewrite: {type: boolean}}}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
  /content/ai/risk:
    get:
      operationId: getContentRisk
      description: "{content id: compliance severity} for the unpublished drafts in the calendar window, so the grid can badge a risky one."
      parameters:
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
  /content/ai/signals:
    get:
      operationId: getContentSignals
      description: Posts the brand should consider publishing now, drawn from live scam, incident and regulatory signals, each with its evidence and Wilson interval.
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
  /content/ai/signals/draft:
    post:
      operationId: draftContentFromSignal
      description: Create a calendar draft from one active signal (template text, or a polished caption when an LLM key is set). Records the originating signal for the closed loop.
      requestBody: {content: {application/json: {schema: {type: object, properties: {key: {type: string}, channel: {type: string}}}}}}
      responses: {"200": {description: Created, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /content/ai/insights:
    get:
      operationId: getContentInsights
      description: Post performance against the brand's own baseline, scam activity under each post, topic reaction and best posting times. Anything resting on too little history says so.
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
  /content/ai/impact:
    get:
      operationId: getContentImpact
      description: Closed loop -- scam-flag or complaint rate in comments before versus after each published post, judged only when the Wilson intervals separate.
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
  /care/cases/{case_id}/survey:
    post:
      operationId: issueCareSurvey
      description: Issue a post-resolution CSAT survey for a case; returns the response token.
      parameters: [{name: case_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: Issued, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /care/surveys/respond:
    post:
      operationId: respondCareSurvey
      description: Record a survey score against its token (agent-assisted capture).
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: Recorded, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /care/cases/{case_id}/suggest:
    post:
      operationId: suggestCareReply
      parameters: [{name: case_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: AI suggestion (text only, never sent), content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /care/cases/{case_id}/schedule:
    post:
      operationId: scheduleCareMessage
      parameters: [{name: case_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /care/cases/{case_id}/scheduled:
    get:
      operationId: listCareScheduled
      description: Pending scheduled outbound messages for a case.
      parameters: [{name: case_id, in: path, required: true, schema: {type: integer}}]
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
  /care/cases/{case_id}/scheduled/{action_id}/cancel:
    post:
      operationId: cancelCareScheduled
      parameters: [{name: case_id, in: path, required: true, schema: {type: integer}}, {name: action_id, in: path, required: true, schema: {type: integer}}]
      responses: {"200": {description: Cancelled, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /care/cases/{case_id}/block:
    post:
      operationId: blockCareCustomer
      parameters: [{name: case_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /care/cases/{case_id}/unblock:
    post:
      operationId: unblockCareCustomer
      parameters: [{name: case_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /care/cases/{case_id}/export:
    get:
      operationId: exportCareCase
      parameters: [{name: case_id, in: path, required: true, schema: {type: integer}}, {name: format, in: query, schema: {type: string, enum: [pdf, xlsx]}}]
      responses: {"200": {description: Case document, content: {application/pdf: {schema: {type: string, format: binary}}, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": {schema: {type: string, format: binary}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /care/search:
    get:
      operationId: careSearch
      parameters: [{name: q, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer}}]
      responses: {"200": {description: Cross-entity autocomplete results, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
  /jobs/refresh:
    post:
      operationId: startRefreshJob
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      responses:
        "200": {description: "Job started or already running", content: {application/json: {schema: {type: object, properties: {job_id: {type: string}, already: {type: boolean}}}}}}
        "403": {$ref: "#/components/responses/Error"}
  /jobs/score:
    post:
      operationId: startScoreJob
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      responses:
        "200": {description: "Job started or already running", content: {application/json: {schema: {type: object, properties: {job_id: {type: string}, already: {type: boolean}}}}}}
        "403": {$ref: "#/components/responses/Error"}
  /jobs/{id}:
    get:
      operationId: pollJob
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200": {description: "Job state and log lines", content: {application/json: {schema: {type: object, properties: {state: {type: string}, lines: {type: array, items: {type: string}}}}}}}
        "404": {$ref: "#/components/responses/Error"}
  /jobs/{id}/stream:
    get:
      operationId: streamJob
      description: Server-sent events; one `data:` frame per poll until the worker settles.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200": {description: SSE stream, content: {text/event-stream: {schema: {type: string}}}}
  /review:
    get:
      operationId: getReviewQueue
      responses:
        "200": {description: Per-rule calibration status and the unlabelled batch, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
  /review/branch-complaints/upload:
    post:
      operationId: uploadBranchComplaints
      description: Bulk-import branch complaints from a CSV (headers Branch Name, Complainant, Complaint Date, "Complaint Text (paraphrased)", Source URL). Inserted rows are scored asynchronously -- a scoring job is enqueued when any row is inserted.
      requestBody: {content: {multipart/form-data: {schema: {type: object, properties: {file: {type: string, format: binary}}}}}}
      responses:
        "200": {description: "Import result", content: {application/json: {schema: {type: object, properties: {inserted: {type: integer}, skipped: {type: integer}, errors: {type: array, items: {type: object, properties: {row: {type: integer}, reason: {type: string}}}}, job_id: {type: string, nullable: true}}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /review/{id}/{verdict}:
    post:
      operationId: labelReviewMention
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
        - {in: path, name: id, required: true, schema: {type: integer}}
        - {in: path, name: verdict, required: true, schema: {type: string, enum: [yes, "no"]}}
      responses:
        "200": {description: gold_label written}
        "403": {$ref: "#/components/responses/Error"}
  /onboarding/state:
    get:
      operationId: getOnboardingState
      responses:
        "200": {description: Full wizard state for the active session workspace, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
  /onboarding/preview:
    get:
      operationId: previewOnboardingBrand
      parameters:
        - {in: query, name: name, schema: {type: string}}
      responses:
        "200": {description: "Sample corpus matches for the auto-generated rules", content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
  /onboarding/{step}:
    patch:
      operationId: applyOnboardingStep
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
        - {in: path, name: step, required: true, schema: {type: integer, minimum: 1, maximum: 5}}
      requestBody:
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        "200": {description: "Step applied; returns the next step (0 when finished)", content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
components:
  parameters:
    CsrfHeader: {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
    Period: {in: query, name: period, schema: {type: string, enum: [7d, 30d, 90d, 12mo, all], default: 90d}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    Error: {type: object, required: [error], properties: {error: {type: string}}}
    Csrf: {type: object, required: [token], properties: {token: {type: string}}}
    Login:
      type: object
      required: [username, password]
      properties: {username: {type: string}, password: {type: string}}
    Workspace:
      type: object
      required: [id, name, market, onboarding_step, slug]
      properties:
        id: {type: integer}
        name: {type: string}
        market: {type: string}
        onboarding_step: {type: integer}
        slug: {type: string}
    User:
      type: object
      required: [id, name, role, roles, perms]
      properties:
        id: {type: integer}
        name: {type: string}
        role: {type: string, enum: [admin, bank_viewer]}
        roles: {type: array, items: {type: string}}
        perms: {type: array, items: {type: string}, description: "effective (area:verb) grants"}
        workspace: {$ref: "#/components/schemas/Workspace"}
    Auth: {type: object, required: [user], properties: {user: {$ref: "#/components/schemas/User"}}}
    Workspaces:
      type: object
      required: [can_switch, list]
      properties:
        active: {$ref: "#/components/schemas/Workspace"}
        can_switch: {type: boolean}
        list: {type: array, items: {$ref: "#/components/schemas/Workspace"}}
    Stats:
      type: object
      required: [items, mentions]
      properties: {items: {type: integer}, mentions: {type: integer}, last_run: {type: [string, "null"]}}
    Overview: {type: object, additionalProperties: true}
    Sentiment: {type: object, additionalProperties: true}
    Competitors: {type: object, additionalProperties: true}
    Reviews:
      type: object
      additionalProperties: true
      required: [focus_brand_id, store_stats]
      properties:
        focus_brand_id: {type: [integer, "null"]}
        store_stats:
          anyOf:
            - {$ref: "#/components/schemas/ReviewStoreStats"}
            - {type: "null"}
    ReviewStoreStats:
      type: object
      description: Real, live figures last fetched by POST /reviews/store-stats/run (Apple's iTunes lookup, free; DataForSEO app_info + a listing-page scrape for each store's histogram, small paid cost for Play Store). Null until the first refresh, and any field a fetch could not get is null rather than fabricated.
      required: [app_store, play_store, combined]
      properties:
        apps:
          description: Every configured app with its own figures (APPSTORE_APP_ID / PLAYSTORE_APP_ID may list several). app_store / play_store are each store's roll-up across its apps.
          type: array
          items:
            allOf:
              - {$ref: "#/components/schemas/ReviewStoreStatsEntry"}
              - type: object
                required: [store, app_id]
                properties:
                  store: {type: string, enum: [app_store, play_store]}
                  app_id: {type: string}
                  name: {type: [string, "null"]}
                  icon: {type: [string, "null"], description: https URL of the app icon, null when unknown.}
        app_store:
          anyOf:
            - {$ref: "#/components/schemas/ReviewStoreStatsEntry"}
            - {type: "null"}
        play_store:
          anyOf:
            - {$ref: "#/components/schemas/ReviewStoreStatsEntry"}
            - {type: "null"}
        combined:
          description: Derived, not separately fetched -- the count-weighted average and summed histogram across whichever of app_store/play_store have real figures. Null only if neither store has a rating yet.
          anyOf:
            - {$ref: "#/components/schemas/ReviewStoreStatsEntry"}
            - {type: "null"}
    ReviewStoreStatsEntry:
      type: object
      required: [rating, count, captured_at]
      properties:
        rating: {type: [number, "null"], minimum: 1, maximum: 5}
        count: {type: [integer, "null"]}
        captured_at: {type: [string, "null"], format: date-time}
        histogram:
          description: Real 1-5 star counts. Play Store figures are scraped exact counts; App Store figures are computed from the listing page's rounded percentages (approximate, real-derived, never a guess). Omitted when a store's histogram couldn't be read.
          type: object
          properties:
            "1": {type: integer}
            "2": {type: integer}
            "3": {type: integer}
            "4": {type: integer}
            "5": {type: integer}
        good_share: {type: [number, "null"], description: "Wilson-interval point estimate for the >=4-star share of `histogram`. Omitted when there's no histogram to compute it from."}
        good_lo: {type: [number, "null"], description: "Wilson lower bound for good_share."}
        good_hi: {type: [number, "null"], description: "Wilson upper bound for good_share."}
    Themes: {type: object, additionalProperties: true}
    Scam: {type: object, additionalProperties: true}
    Triage: {type: object, additionalProperties: true}
    SwitchIntent: {type: object, additionalProperties: true}
    Incidents: {type: object, additionalProperties: true}
    ProductLines: {type: object, additionalProperties: true}
    Regulatory: {type: object, additionalProperties: true}
    Impersonation: {type: object, additionalProperties: true}
    Branches: {type: object, additionalProperties: true}
    BranchMap: {type: object, additionalProperties: true}
    BranchItems: {type: object, additionalProperties: true}
    Alerts: {type: object, additionalProperties: true}
    Mentions: {type: object, additionalProperties: true}
