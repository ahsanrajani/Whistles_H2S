openapi: 3.1.0
info:
  title: Guru Ears API
  version: 1.0.0
  description: Session-authenticated JSON contract used by the Next.js migration UI.
servers:
  - url: /api/v1
paths:
  /csrf:
    get:
      operationId: getCsrf
      responses:
        "200": {description: CSRF token, content: {application/json: {schema: {$ref: "#/components/schemas/Csrf"}}}}
  /auth/login:
    post:
      operationId: login
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Login"}}}
      responses:
        "200": {description: Authenticated user, content: {application/json: {schema: {$ref: "#/components/schemas/Auth"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /auth/logout:
    post:
      operationId: logout
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      responses:
        "200": {description: Logged out}
  /auth/me:
    get:
      operationId: getMe
      responses:
        "200": {description: Current user, content: {application/json: {schema: {$ref: "#/components/schemas/Auth"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /auth/oauth/google/start:
    get:
      operationId: googleSignInStart
      description: >
        Browser-navigation endpoint (not fetched by the typed client). Redirects
        to Google's consent screen, or straight to the callback in mock mode.
      responses:
        "302": {description: Redirect to the identity provider}
  /auth/oauth/google/callback:
    get:
      operationId: googleSignInCallback
      description: >
        Google redirects the browser here. On success the session is
        established and the browser is bounced to APP_BASE_URL/?auth=ok; on
        failure to APP_BASE_URL/?auth_error=<message>.
      responses:
        "302": {description: Redirect back to the app}
  /workspaces:
    get:
      operationId: getWorkspaces
      responses:
        "200": {description: Workspace state, content: {application/json: {schema: {$ref: "#/components/schemas/Workspaces"}}}}
  /projects:
    get:
      operationId: getProjects
      description: Projects for the active workspace (frontend F0.1). Always at least the default 'listening' project.
      responses:
        "200": {description: Project list, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
  /workspace/switch:
    post:
      operationId: switchWorkspace
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [ws_id], properties: {ws_id: {type: integer}}}}}
      responses:
        "200": {description: Switched}
        "403": {$ref: "#/components/responses/Error"}
  /stats:
    get:
      operationId: getStats
      responses:
        "200": {description: Header totals, content: {application/json: {schema: {$ref: "#/components/schemas/Stats"}}}}
  /overview:
    get:
      operationId: getOverview
      parameters:
        - {in: query, name: period, schema: {type: string, enum: [7d, 30d, 90d, 12mo, all]}}
        - {in: query, name: channel, schema: {type: string}}
      responses:
        "200": {description: Overview analytics, content: {application/json: {schema: {$ref: "#/components/schemas/Overview"}}}}
  /sentiment:
    get:
      operationId: getSentiment
      parameters:
        - {$ref: "#/components/parameters/Period"}
      responses:
        "200": {description: Sentiment analytics, content: {application/json: {schema: {$ref: "#/components/schemas/Sentiment"}}}}
  /competitors:
    get:
      operationId: getCompetitors
      parameters:
        - {$ref: "#/components/parameters/Period"}
      responses:
        "200": {description: Competitive analytics, content: {application/json: {schema: {$ref: "#/components/schemas/Competitors"}}}}
  /reviews:
    get:
      operationId: getReviews
      parameters:
        - {$ref: "#/components/parameters/Period"}
      responses:
        "200": {description: App review analytics, content: {application/json: {schema: {$ref: "#/components/schemas/Reviews"}}}}
  /reviews/store-stats/run:
    post:
      operationId: runReviewStoreStats
      description: Pull real average rating + total rating count for both app stores, plus each store's real 1-5 star breakdown, right now (Apple's iTunes lookup and listing-page scrape are free; the DataForSEO app_info call has a small real cost). Never scheduled.
      responses: {"200": {description: Ran, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
  /themes:
    get:
      operationId: getThemes
      responses:
        "200": {description: Focus-brand themes, content: {application/json: {schema: {$ref: "#/components/schemas/Themes"}}}}
  /scam:
    get:
      operationId: getScamSignals
      description: Deterministic scam / brand-abuse signal scoring over owned-channel comments. Returns the full scoring policy alongside the flags so every result is auditable.
      parameters:
        - {$ref: "#/components/parameters/Period"}
        - {in: query, name: channel, schema: {type: string}}
      responses:
        "200": {description: Comment scam signals, content: {application/json: {schema: {$ref: "#/components/schemas/Scam"}}}}
  /triage:
    get:
      operationId: getComplaintTriage
      description: Deterministic escalation-risk scoring over complaint-shaped mentions. Returns the full weight/band policy alongside the ranked queue.
      parameters:
        - {$ref: "#/components/parameters/Period"}
      responses:
        "200": {description: Complaint severity triage, content: {application/json: {schema: {$ref: "#/components/schemas/Triage"}}}}
  /switch-intent:
    get:
      operationId: getSwitchIntent
      description: Deterministic churn / switch-intent scoring over focus-brand mentions. Returns the full weight/band policy alongside the ranked queue.
      parameters:
        - {$ref: "#/components/parameters/Period"}
      responses:
        "200": {description: Switch-intent signals, content: {application/json: {schema: {$ref: "#/components/schemas/SwitchIntent"}}}}
  /incidents:
    get:
      operationId: getCompetitorIncidents
      description: Per-brand mention-velocity z-score against a trailing 28-day baseline, gated on incident-shaped keywords. Window sizes and thresholds are returned in the payload.
      responses:
        "200": {description: Competitor incident detection, content: {application/json: {schema: {$ref: "#/components/schemas/Incidents"}}}}
  /product-lines:
    get:
      operationId: getProductLines
      description: Deterministic keyword tagging of focus-brand mentions into product lines, with share of voice and sentiment per line. The keyword lists are returned in the payload.
      parameters:
        - {$ref: "#/components/parameters/Period"}
      responses:
        "200": {description: Product-line share of voice, content: {application/json: {schema: {$ref: "#/components/schemas/ProductLines"}}}}
  /regulatory:
    get:
      operationId: getRegulatoryWatch
      description: Dated feed of collected SBP / Banking Mohtasib / PSX notices, each tagged with a topic and any workspace brand it names. The topic lexicon is returned in the payload.
      responses:
        "200": {description: Regulatory watch feed, content: {application/json: {schema: {$ref: "#/components/schemas/Regulatory"}}}}
  /report:
    get:
      operationId: getHighlightsReport
      description: Executive highlights as a designed one-page PDF (logo, priorities, headline numbers, likely-to-switch verbatims, branches needing attention). 501 if PDF rendering is unavailable.
      responses:
        "200": {description: PDF, content: {application/pdf: {schema: {type: string, format: binary}}}}
        "501": {$ref: "#/components/responses/Error"}
  /reports/metrics/catalog:
    get:
      operationId: getMetricsCatalog
      description: What is queryable in the metric warehouse for this workspace — (source, metric, entity_type) tuples, whether each is a proportion, the dims present, and the groupable keys.
      responses:
        "200": {description: Metric catalog, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
  /reports/social:
    get:
      operationId: getSocialReport
      description: Owned-social report for one source — account summary with period deltas, post / video / Reel scorecards, and engagement rate by media type. Proportions are Wilson-scored.
      parameters:
        - {name: source, in: query, required: true, schema: {type: string}}
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        "200": {description: Social report, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /reports/export:
    get:
      operationId: exportReport
      description: Render a P4 report (metrics · sla · csat · complaints · care_agents · social) to CSV / Excel / PDF with charts.
      parameters:
        - {name: kind, in: query, required: true, schema: {type: string, enum: [metrics, sla, csat, complaints, care_agents, social, mis_daily, mis_closed]}}
        - {name: format, in: query, schema: {type: string, enum: [csv, xlsx, pdf]}}
        - {name: source, in: query, schema: {type: string}}
        - {name: metric, in: query, schema: {type: string}}
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: Rendered report
          content:
            text/csv: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /reports/csat:
    get:
      operationId: getCsatReport
      description: CSAT %, response rate and NPS (Wilson-scored proportions), score distribution and per-channel breakdown, over a date window.
      parameters:
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: CSAT report, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /reports/complaints:
    get:
      operationId: getComplaintReport
      description: Complaint volume, resolution time, Wilson-scored reopen rate, breakdown by closure category and channel, and CSAT for those cases.
      parameters:
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: Complaint analytics, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /reports/mis/daily:
    get:
      operationId: getMisDaily
      description: "MIS: opened / closed / reopened case counts per day, with totals."
      parameters:
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: Daily case counts, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /reports/mis/closed-cases:
    get:
      operationId: getMisClosedCases
      description: "MIS: the flat 13-column closed-case report for the window."
      parameters:
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: Closed-case rows, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /reports/schedules:
    get:
      operationId: listReportSchedules
      responses: {"200": {description: Report schedules, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createReportSchedule
      description: Bind a report (kind + format + params) to a cron and recipients; registers a scheduled_task that emails it.
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: Created, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /reports/schedules/{schedule_id}:
    put:
      operationId: updateReportSchedule
      parameters: [{name: schedule_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
    delete:
      operationId: deleteReportSchedule
      parameters: [{name: schedule_id, in: path, required: true, schema: {type: integer}}]
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /reports/schedules/{schedule_id}/run:
    post:
      operationId: runReportSchedule
      description: Render and email this schedule now.
      parameters: [{name: schedule_id, in: path, required: true, schema: {type: integer}}]
      responses: {"200": {description: Delivery result, content: {application/json: {schema: {type: object, additionalProperties: true}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /reports/sla:
    get:
      operationId: getSlaReport
      description: First-response and resolution SLA compliance (Wilson-scored proportions), first-response and assignment-wait time distributions, and missed-SLA count reconciled against case_event, over a date window.
      parameters:
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: SLA report, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /reports/care/agents:
    get:
      operationId: getCareAgentReport
      description: Per-agent session / ready / not-ready / idle seconds from agent_activity, joined with handling time from case timestamps, over a date window.
      parameters:
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: Care agent activity report, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /reports/metrics:
    get:
      operationId: getMetricsReport
      description: One measure over a date window — headline (Wilson-scored when a proportion), daily series, optional dimension breakdown, and the preceding equal-length window for comparison.
      parameters:
        - {name: source, in: query, required: true, schema: {type: string}}
        - {name: metric, in: query, required: true, schema: {type: string}}
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {name: entity_type, in: query, schema: {type: string}}
        - {name: group_by, in: query, schema: {type: string, enum: [entity_ref, entity_type, media_type, country]}}
        - {name: compare, in: query, schema: {type: boolean}}
      responses:
        "200": {description: Metric report, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /branches:
    get:
      operationId: getBranchPerformance
      description: Per-branch rollup of Google Maps reviews and branch-resolved social mentions — mean rating, 30-day rating delta, complaint count, Critical count (via the triage scorer), keyword-tagged operational issues, and a deterministic attention score. Worst-first.
      parameters:
        - {$ref: "#/components/parameters/Period"}
      responses:
        "200": {description: Branch & ATM performance, content: {application/json: {schema: {$ref: "#/components/schemas/Branches"}}}}
  /branches/{key}/items:
    get:
      operationId: getBranchItems
      description: Every review / social mention attributed to one branch, newest first, paginated. `issue` narrows to one keyword-tagged issue theme, using the same attribution and lexicon as /branches so the total equals that card's issue count.
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/Period"}
        - {name: issue, in: query, schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
        - {name: limit, in: query, schema: {type: integer, default: 25, maximum: 100}}
      responses:
        "200": {description: Branch items page, content: {application/json: {schema: {$ref: "#/components/schemas/BranchItems"}}}}
  /branches/map:
    get:
      operationId: getBranchMap
      description: Bank Alfalah's real branch network (data/branches.csv, ~1,186 branches with real coordinates) merged with the branch_perf rollup by branch code. The full geocoded catalogue, not just the branches with review/social signal.
      responses:
        "200": {description: Branch map geodata, content: {application/json: {schema: {$ref: "#/components/schemas/BranchMap"}}}}
  /impersonation:
    get:
      operationId: getImpersonationWatch
      description: "Admin only. Live best-effort probe: deterministic lookalike-domain permutations of the configured BRAND_DOMAINS, each checked for a DNS record and a Certificate Transparency match. Not a database read; network failures degrade to 'unknown' / 'unavailable'."
      responses:
        "200": {description: Lookalike-domain candidates ranked by risk, content: {application/json: {schema: {$ref: "#/components/schemas/Impersonation"}}}}
        "403": {$ref: "#/components/responses/Error"}
  /alerts:
    get:
      operationId: getAlerts
      description: Deterministic threshold rules evaluated against the analysis surfaces (scam, triage, switch-intent, incidents, regulatory, sentiment). Every rule is returned with its current value, threshold and fired flag.
      responses:
        "200": {description: Alert evaluation, content: {application/json: {schema: {$ref: "#/components/schemas/Alerts"}}}}
  /alerts/dispatch:
    post:
      operationId: dispatchAlerts
      description: Admin only. Evaluate now and push the firing alerts to the configured Slack incoming webhook and/or generic JSON webhook.
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      responses:
        "200": {description: What was sent, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
  /mentions:
    get:
      operationId: getMentions
      parameters:
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: brand_id, schema: {type: integer}}
        - {in: query, name: surface, schema: {type: string}}
        - {in: query, name: outlet, schema: {type: string}}
        - {in: query, name: sentiment, schema: {type: string}}
        - {in: query, name: type, schema: {type: string}}
        - {in: query, name: rating, schema: {type: string}}
        - {in: query, name: since, schema: {type: string}}
        - {in: query, name: sort, schema: {type: string}}
      responses:
        "200": {description: Filtered story-collapsed mentions, content: {application/json: {schema: {$ref: "#/components/schemas/Mentions"}}}}
  /mentions/export.csv:
    get:
      operationId: exportMentions
      responses:
        "200": {description: Filtered CSV, content: {text/csv: {schema: {type: string}}}}
  /mentions/{id}/{action}:
    post:
      operationId: setMentionVisibility
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
        - {in: path, name: id, required: true, schema: {type: integer}}
        - {in: path, name: action, required: true, schema: {type: string, enum: [hide, show]}}
      responses:
        "200": {description: Visibility changed}
        "403": {$ref: "#/components/responses/Error"}
  /admin/workspaces:
    get:
      operationId: getAdminWorkspaces
      responses:
        "200": {description: Workspace list with the active id, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createAdminWorkspace
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}, market: {type: string}, volume_scenario: {type: string}, sentiment_langs: {type: string}}}}}
      responses:
        "200": {description: Created}
        "403": {$ref: "#/components/responses/Error"}
  /admin/brands:
    get:
      operationId: getAdminBrands
      responses:
        "200": {description: Brands and matching rules for the active workspace, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: saveAdminBrand
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name], properties: {brand_id: {type: integer}, name: {type: string}, is_focus: {type: boolean}, archive: {type: boolean}, safe_patterns: {}, gated_patterns: {}, context_patterns: {}, exclude_patterns: {}}}}}
      responses:
        "200": {description: Saved, returns the refreshed brand list}
        "403": {$ref: "#/components/responses/Error"}
  /admin/brands/preview:
    post:
      operationId: previewAdminBrand
      description: Runs the candidate rules through the shared entity matcher against the existing corpus. No writes.
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {name: {type: string}, safe_patterns: {}, gated_patterns: {}, context_patterns: {}, exclude_patterns: {}}}}}
      responses:
        "200": {description: "Match count, capped sample rows, and per-pattern regex errors", content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
  /admin/rematch:
    post:
      operationId: rematchCorpus
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      responses:
        "200": {description: Corpus re-matched against saved rules}
        "403": {$ref: "#/components/responses/Error"}
  /admin/users:
    get:
      operationId: getAdminUsers
      responses:
        "200": {description: Users and assignable workspaces, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createAdminUser
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [username, password, workspace_id], properties: {username: {type: string}, password: {type: string}, workspace_id: {type: integer}}}}}
      responses:
        "200": {description: Created}
        "403": {$ref: "#/components/responses/Error"}
  /admin/keys:
    get:
      operationId: getAdminKeys
      responses:
        "200": {description: Per-workspace and shared credentials, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: saveAdminKey
      parameters: [{$ref: "#/components/parameters/CsrfHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [env_var], properties: {env_var: {type: string}, value: {type: string}, workspace_id: {type: integer}}}}}
      responses:
        "200": {description: Saved (shared keys also mirror to .env)}
        "403": {$ref: "#/components/responses/Error"}
  /admin/sources:
    get:
      operationId: getAdminSources
      responses:
        "200": {description: Source registry, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
  /admin/sources/health:
    get:
      operationId: getAdminSourceHealth
      responses:
        "200": {description: Per-source collection health for this workspace, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
  /admin/features:
    get:
      operationId: getAdminFeatures
      description: Every feature flag (surface / module / capability) with its per-workspace on/off state.
      responses:
        "200": {description: Feature flags, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "403": {$ref: "#/components/responses/Error"}
  /admin/features/{feature_key}:
    put:
      operationId: setAdminFeature
      description: Turn one feature on/off for this workspace.
      parameters: [{name: feature_key, in: path, required: true, schema: {type: string}}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {enabled: {type: boolean}}}}}}
