# Dev infrastructure for the Guru API: Postgres + Redis. Redis backs server-side
# sessions from P1.4 on (later also presence / rate limits).
#
#   docker compose -f ops/compose/docker-compose.yml up -d
#   docker compose -f ops/compose/docker-compose.yml down          # keep data
#   docker compose -f ops/compose/docker-compose.yml down -v       # wipe data
#
# npm run db:up / db:down are shortcuts for the two `up`/`down` lines.

name: guru

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: guru
      POSTGRES_DB: guru
    ports:
      - "5432:5432"
    volumes:
      - guru_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guru -d guru"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  guru_pgdata:
